
  <!DOCTYPE html>
  <html lang="es" translate="no">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="google" content="notranslate" />
      <meta name="theme-color" content="#282A36" />

      <style>
        html, body { margin: 0; background: #282A36; }
        #kivo-splash {
          position: fixed;
          inset: 0;
          z-index: 2147483646;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #282A36;
          transition: opacity 220ms ease;

        #kivo-splash.is-done { opacity: 0; }
        #kivo-splash img {
          width: 92px;
          height: 92px;
          object-fit: contain;
        }
      </style>

    <body translate="no">
      <div id="kivo-splash" aria-hidden="true">
